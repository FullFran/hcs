name: Release

# A tag `v<version>` publishes the GitHub release (docs/releasing.md). Pull requests that change the
# release machinery, and a manual run, rehearse every step with a throwaway version and publish nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - tools/release.py
      - tools/build_release.py
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REHEARSAL_VERSION: 0.0.0-rehearsal

jobs:
  ready:
    name: Version, notes and SDK version agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        name: Resolve the version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$REHEARSAL_VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rehearsal: version $REHEARSAL_VERSION, nothing is published"
          fi
      - name: Prepare the rehearsal version
        if: steps.version.outputs.publish == 'false'
        run: |
          python3 tools/release.py prepare "$REHEARSAL_VERSION"
          sed -i 's/TODO(release)/Rehearsal/' "docs/releases/v$REHEARSAL_VERSION.md"
      - run: python3 tools/release.py check "${{ steps.version.outputs.version }}"

  checks:
    name: Checks
    needs: ready
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: [ready, checks]
    # `checks` is skipped on pull requests, where CI already runs them.
    if: ${{ !cancelled() && needs.ready.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.checks.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.ready.outputs.version }}
      PUBLISH: ${{ needs.ready.outputs.publish }}
      # Outside the checkout; upload-artifact refuses paths with `..`.
      OUT: ${{ github.workspace }}-dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main
        if: env.PUBLISH == 'true'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::v$VERSION ($GITHUB_SHA) is not on main"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - name: Commit the rehearsal version
        if: env.PUBLISH == 'false'
        run: |
          python3 tools/release.py prepare "$VERSION"
          sed -i 's/TODO(release)/Rehearsal/' "docs/releases/v$VERSION.md"
          # build_release.py builds from a commit, never from the working tree.
          git add sdk/ts/package.json sdk/ts/package-lock.json "docs/releases/v$VERSION.md"
          git -c user.name=rehearsal -c user.email=rehearsal@invalid commit -qm "chore: rehearse v$VERSION"
      - name: Build the artefact (reproducibility check, then the build)
        run: |
          REF=$(git rev-parse HEAD)
          echo "REF=$REF" >> "$GITHUB_ENV"
          python3 tools/build_release.py --version "$VERSION" --ref "$REF" --out "$OUT" --check
          python3 tools/build_release.py --version "$VERSION" --ref "$REF" --out "$OUT"
          (cd "$OUT" && sha256sum -c "hcs-$VERSION.tar.gz.sha256")
      - name: Pack the SDK
        working-directory: sdk/ts
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "$OUT"
      - name: Release notes
        run: |
          python3 tools/release.py notes "$VERSION" --dist "$OUT" --ref "$REF" > "$OUT/notes.md"
          cat "$OUT/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.ready.outputs.version }}
          path: |
            ${{ env.OUT }}/hcs-${{ needs.ready.outputs.version }}.tar.gz
            ${{ env.OUT }}/hcs-${{ needs.ready.outputs.version }}.tar.gz.sha256
            ${{ env.OUT }}/fullfran-hcs-sdk-${{ needs.ready.outputs.version }}.tgz
            ${{ env.OUT }}/notes.md
          retention-days: 7
      - name: Publish the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" --verify-tag "${prerelease[@]}" --title "HCS v$VERSION" \
            --notes-file "$OUT/notes.md" \
            "$OUT/hcs-$VERSION.tar.gz" "$OUT/hcs-$VERSION.tar.gz.sha256" "$OUT/fullfran-hcs-sdk-$VERSION.tgz"
      - name: Check the download
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/download"
          gh release download "v$VERSION" -D "$RUNNER_TEMP/download"
          for f in "hcs-$VERSION.tar.gz" "hcs-$VERSION.tar.gz.sha256" "fullfran-hcs-sdk-$VERSION.tgz"; do
            cmp "$OUT/$f" "$RUNNER_TEMP/download/$f"
          done
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
